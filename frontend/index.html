<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Perpustakaan</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9', // Warna biru utama yang modern
                            600: '#0284c7', // Warna saat hover
                            900: '#0c4a6e',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Warna background netral modern (slate-50) */
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-slate-800">

    <div class="text-center">
        <h1 class="text-3xl font-bold text-slate-800 mb-4">Memuat Aplikasi...</h1>
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-brand-500 mx-auto"></div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Logika sederhana: Jika sudah login, lempar ke dashboard. Jika belum, lempar ke login.
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (isAuthenticated()) {
                    window.location.href = 'dashboard.html';
                } else {
                    window.location.href = 'login.html';
                }
            }, 1000); // Jeda 1 detik agar animasi loading terlihat
        });
    </script>

</body>
</html>
